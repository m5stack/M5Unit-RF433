## Dependencies for the ESP-IDF build of the UnitRF433T PlotToSerial example.
## - M5Unit-RF433 is taken from the local checkout (path) so the example builds against the
##   library in this repo. M5UnitUnified (and its transitive deps M5HAL / M5Utility) are pulled in via
##   M5Unit-RF433's own idf_component.yml.
## - M5Unified >=0.2.17 declares M5GFX as a transitive dependency in its idf_component.yml.
dependencies:
  idf: ">=5.1"
  m5stack/M5Unit-RF433:
    path: "../../../../.."
  m5stack/M5Unified: ">=0.2.17"
