name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        example:
          - PlotToSerial

        unit:
          - UnitRF433R
          - UnitRF433T

        board:
          # One board per compile config (toolchain x chip arch).
          # Others differ only in the variant header and are commented out with the reason.
          # espressif32 x ESP32 (RMT v1)
          - Core
          #- Core2       # ESP32: represented by Core
          #- Fire        # ESP32: represented by Core
          #- Atom        # ESP32: represented by Core
          #- StickCPlus  # ESP32: represented by Core
          #- StickCPlus2 # ESP32: represented by Core
          #- Paper       # ESP32: represented by Core
          #- CoreInk     # ESP32: represented by Core
          # espressif32 x ESP32-S3 (RMT v1)
          - CoreS3
          #- StampS3     # ESP32-S3: represented by CoreS3
          #- Dial        # ESP32-S3: represented by CoreS3
          #- AtomS3      # ESP32-S3: represented by CoreS3
          #- AtomS3R     # ESP32-S3: represented by CoreS3
          #- StickS3     # ESP32-S3: represented by CoreS3
          #- Cardputer   # ESP32-S3: represented by CoreS3
          # pioarduino x ESP32-C6 (RMT v2)
          - NanoC6
          #- NessoN1     # ESP32-C6: represented by NanoC6
          # pioarduino x ESP32-H2 (RMT v2)
          - NanoH2
          # pioarduino x ESP32-P4 (RMT v2)
          - Tab5

        framework:
          - Arduino

        espressif32:
          - latest

        include:
          # Specific sketches
          - example: Transceiver
            board: Core
            framework: Arduino
            espressif32: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
