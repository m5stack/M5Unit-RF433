description: Library for M5Stack UNIT RF433 (RF433T / RF433R) using M5UnitUnified.
url: https://github.com/m5stack/M5Unit-RF433
issues: https://github.com/m5stack/M5Unit-RF433/issues
license: MIT
version: "0.2.0"

dependencies:
  idf: ">=5.1"
  # M5UnitUnified / M5Utility are not yet on the ESP Component Registry, so reference the main
  # branch via git (switch to a version constraint after publish).
  m5stack/M5UnitUnified:
    git: https://github.com/m5stack/M5UnitUnified.git
    version: main
  m5stack/M5Utility:
    git: https://github.com/m5stack/M5Utility.git
    version: main

# RMT is required. ESP32-C2 / C61 have no RMT and are not listed.
targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c5
  - esp32c6
  - esp32h2
  - esp32p4

files:
  exclude:
    - "docs/**"
    - "examples/**"
    - "test/**"
    - "boards/**"
    - "datasheet/**"
    - "platformio.ini"
    - "library.json"
    - "library.properties"
    - "*_env.ini"
    - ".clang-format"
    - ".gitignore"
